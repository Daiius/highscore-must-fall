name: Build and push server image to GHCR

# 本番（linux/amd64）向けの server イメージを CI でビルドして GHCR へ push する。参考: seseraki / girls-side-analysis。
# main への push（下の paths に当たるとき）と、手動起動（workflow_dispatch）で走る。
# ⚠ 本番の VPS は `latest` を数分おきに見て、変わっていれば自動で入れ替える（タグの追従）。
#   つまり **main に入った server の変更は、このビルドを経て数分で本番に出る**（AGENTS.md「main に入ると本番に出る」）。
# web は Docker 化せず、Vite ビルド出力を本番 nginx へ配置する運用のため対象外。worker も対象外。

on:
  push:
    branches: [main]
    # Dockerfile.prod が読むものだけ（漏れると server に効く変更がビルドされず、広すぎると関係ない変更で本番が再起動する）。
    #   - packages/{server,shared,database}: ソースの COPY（Dockerfile.prod 自身も packages/server/ の下）
    #   - 根の pnpm-workspace.yaml / package.json / pnpm-lock.yaml / tsconfig.base.json: 先頭の COPY
    #   - この workflow 自身: ビルドの手順・タグ・ビルド引数
    # 入れていないもの（COPY はされるが、server の実行物を変えない）:
    #   packages/web/package.json・packages/worker/package.json（依存を変えれば pnpm-lock.yaml が変わる）、
    #   .githooks/（install の prepare フックが開けるためだけ）、.dockerignore（COPY は明示のパスだけ）。
    # ⚠ 下の印の間は「latest を付けるか」の step もこのファイルから読む（一覧はここ 1 か所だけ）。
    #   形は「- <パス>」を 1 行ずつ。印を消したり、ほかの形の行を挟むと、その step は latest を付けずに止まる。
    paths:
      # >>> server-paths
      - packages/server/**
      - packages/shared/**
      - packages/database/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - package.json
      - tsconfig.base.json
      - .github/workflows/build-push-server.yml
      # <<< server-paths
  workflow_dispatch:

# 同じ ref のビルドは直列にする（古いコミットのビルドが、あとから `latest` を上書きしないように）。
# 待っている回は、より新しい回が来れば GitHub が取り消す（走るのは「今の 1 つ」と「最新の 1 つ」だけ）。
# 走っている回は打ち切らない（cancel-in-progress: false）: push の途中で止めると、タグの一部だけが
# 付け替わった半端な状態が残りうる。待っても 1 回分のビルドで済む。
concurrency:
  group: build-push-server-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 「latest を付けるか」の判定に main の履歴が要る（祖先の判定と差分）。浅い取得にしない。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest`（本番が追いかけるタグ）を付けるのは、次の全部を満たすときだけ:
      #   1. 既定の枝（main）の回である（手動起動でほかの枝を選んだ回には付けない）
      #   2. このコミットが、いまのリモートの main の先頭か、その祖先である（main に無いコミットには付けない）
      #   3. このコミットから main の先頭までの間に、上の paths（ビルド対象）に効く変更が無い
      #      ＝このイメージは main の最新と同じ中身。効く変更があれば、そのコミットで別の回が走って付ける。
      #      （先頭だけを見ると、server の変更 A のあとに文書だけの B が入ったとき、A に付かず、B ではビルドが
      #        起動しないので、A が本番に出ないまま残る。古い回の再実行は 3 で弾かれ、latest は戻らない）
      # 判定できないとき（履歴が浅い・main を取れない・paths の一覧を読めない）は、安全側で付けない。
      # 結果と理由は実行の Summary に 1 行出す。
      # paths の照合は git の pathspec（:(glob)）で行う。`*` は `/` を越えず、末尾の `/**` は配下すべてで、
      # 今の一覧の書き方では GitHub の paths フィルタと同じ範囲になる（`?`・`+`・`!` などは使わないこと）。
      - name: Decide whether to move latest
        id: latest
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          WORKFLOW_FILE: .github/workflows/build-push-server.yml
        run: |
          # Actions の bash は -e -o pipefail で動く。失敗を判定に使うコマンドは if / || で受ける。
          set -u
          decide() {
            echo "enable=$1" >> "$GITHUB_OUTPUT"
            if [ "$1" = true ]; then verb="latest を付ける"; else verb="latest を付けない"; fi
            echo "${verb}: $2（${GITHUB_SHA}）" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          }

          if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            decide false "既定の枝（$DEFAULT_BRANCH）の回ではない（$GITHUB_REF）"
          fi

          # paths の一覧を、このコミットの workflow の印の間から読む。
          if [ "$(grep -c '^ *# >>> server-paths$' "$WORKFLOW_FILE")" != 1 ] ||
             [ "$(grep -c '^ *# <<< server-paths$' "$WORKFLOW_FILE")" != 1 ]; then
            decide false "paths の一覧の印（server-paths）が見つからない"
          fi
          specs=()
          while IFS= read -r line; do
            t="${line#"${line%%[![:space:]]*}"}"
            case "$t" in
              ''|'#'*) ;;
              '- '*) specs+=(":(glob)${t#- }") ;;
              *) decide false "paths の一覧に読めない行がある: $t" ;;
            esac
          done < <(sed -n '/^ *# >>> server-paths$/,/^ *# <<< server-paths$/p' "$WORKFLOW_FILE")
          if [ "${#specs[@]}" -eq 0 ]; then
            decide false "paths の一覧が空"
          fi

          if ! git fetch --quiet --no-tags origin "refs/heads/$DEFAULT_BRANCH"; then
            decide false "リモートの $DEFAULT_BRANCH を取得できない"
          fi
          if [ "$(git rev-parse --is-shallow-repository)" != false ]; then
            decide false "履歴が浅く、祖先と差分を判定できない"
          fi
          if ! head=$(git rev-parse --verify --quiet 'FETCH_HEAD^{commit}'); then
            decide false "リモートの $DEFAULT_BRANCH の先頭を読めない"
          fi

          if [ "$head" = "$GITHUB_SHA" ]; then
            decide true "$DEFAULT_BRANCH の先頭"
          fi
          rc=0
          git merge-base --is-ancestor "$GITHUB_SHA" "$head" || rc=$?
          case $rc in
            0) ;;
            1) decide false "$DEFAULT_BRANCH の先頭（$head）の祖先ではない" ;;
            *) decide false "$DEFAULT_BRANCH の先頭（$head）との祖先の判定に失敗した" ;;
          esac
          if ! changed=$(git diff --name-only "$GITHUB_SHA" "$head" -- "${specs[@]}"); then
            decide false "$DEFAULT_BRANCH の先頭（$head）との差分を取れない"
          fi
          if [ -n "$changed" ]; then
            n=$(printf '%s\n' "$changed" | wc -l)
            decide false "あとのコミットにビルド対象の変更がある（${n} 件。例: $(printf '%s\n' "$changed" | head -n 1)。その回が付ける）"
          fi
          decide true "$DEFAULT_BRANCH は先（$head）へ進んだが、間にビルド対象の変更が無い"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # 最終的なイメージ名は ghcr.io/daiius/highscore-must-fall-server（小文字化される）。
          images: ghcr.io/${{ github.repository }}-server
          # 付与するタグ:
          #   - ブランチ名（/ は - に置換）例: :main
          #   - sha-<40桁フル SHA>            固定参照用
          #   - :latest                       上の step が付けると決めたときだけ。本番が追いかけるタグ
          tags: |
            type=ref,event=branch
            type=sha,format=long
            type=raw,value=latest,enable=${{ steps.latest.outputs.enable == 'true' }}

      # ビルドの版（GET /api/version が返す。prd/02 §9.3）。日時は UTC。
      - name: Build time
        id: buildtime
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/server/Dockerfile.prod
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # checkout したままのツリーからビルドするので dirty は常に false。
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.buildtime.outputs.value }}
            GIT_DIRTY=false
          cache-from: type=gha
          cache-to: type=gha,mode=max
