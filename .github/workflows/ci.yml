name: CI

# ローカルの品質ゲート（Biome / typecheck / Vitest）を PR と main push で回す。
# コマンドは package.json のスクリプトと一致させる（ローカルと CI で同じ実体）。

on:
  push:
    branches: [main]
  pull_request:

# GITHUB_TOKEN は読み取りだけ（リポジトリの既定に頼らず、ここで明示する。自動で作られる依存の修正の PR も、この権限で動く）。
permissions:
  contents: read

# 同一 ref の実行が重なったら古い方をキャンセル。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # packageManager フィールド（pnpm@12.x）を尊重して pnpm を用意。
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      # lockfile を固定して再現性を担保（catalog の版ズレを検出）。
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Biome check
        run: pnpm check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
