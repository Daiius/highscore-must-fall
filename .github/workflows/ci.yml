name: CI

# ローカルの品質ゲート（Biome / typecheck / Vitest）を PR と main push で回す。
# コマンドは package.json のスクリプトと一致させる（ローカルと CI で同じ実体）。

on:
  push:
    branches: [main]
  pull_request:

# GITHUB_TOKEN は読み取りだけ（リポジトリの既定に頼らず、ここで明示する。自動で作られる依存の修正の PR も、この権限で動く）。
permissions:
  contents: read

# 同一 ref の実行が重なったら古い方をキャンセル。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # packageManager フィールド（pnpm@12.x）を尊重して pnpm を用意。
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      # lockfile を固定して再現性を担保（catalog の版ズレを検出）。
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Biome check
        run: pnpm check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
